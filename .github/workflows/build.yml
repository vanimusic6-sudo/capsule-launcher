name: Capsule development build

on:
  workflow_dispatch:
  push:
    branches:
      - "next/**"
    paths-ignore:
      - "docs/**"
      - "README.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
      - "media/**"

concurrency:
  group: capsule-dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Environment
        shell: pwsh
        run: |
          dotnet --info
          pwsh --version

      - name: Test fullscreen foundation
        shell: pwsh
        run: |
          $testProject = Join-Path $env:GITHUB_WORKSPACE "source\Tests\Playnite.FullscreenApp.Tests\Playnite.FullscreenApp.Tests.csproj"
          dotnet restore $testProject
          if ($LASTEXITCODE -ne 0) { throw "Test restore failed." }

          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = (& $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1)
          if ([string]::IsNullOrWhiteSpace($msbuild)) { throw "MSBuild not found." }

          $solutionDir = (Join-Path $env:GITHUB_WORKSPACE "source") + "\"
          & $msbuild $testProject /p:Configuration=Release /p:Platform=x86 "/p:SolutionDir=$solutionDir" /m
          if ($LASTEXITCODE -ne 0) { throw "Test project build failed." }

          $testAssembly = Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE "source\Tests\Playnite.FullscreenApp.Tests\bin") -Filter "Playnite.FullscreenApp.Tests.dll" -Recurse |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($null -eq $testAssembly) { throw "Test assembly not found." }

          $vstest = (& $vswhere -latest -products * -find "Common7\IDE\CommonExtensions\Microsoft\TestWindow\vstest.console.exe" | Select-Object -First 1)
          if ([string]::IsNullOrWhiteSpace($vstest)) { throw "VSTest Console not found." }

          & $vstest $testAssembly.FullName /Platform:x86 /Logger:"trx;LogFileName=capsule-fullscreen-tests.trx"
          if ($LASTEXITCODE -ne 0) { throw "Fullscreen tests failed." }
      - name: Build portable package
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "capsule-build"
          $packages = Join-Path $env:GITHUB_WORKSPACE "artifacts"
          ./build/build.ps1 -Configuration Release -OutputDir $out -InstallerDir $packages -Package
          Move-Item (Join-Path $packages "Playnite.zip") (Join-Path $packages "CapsuleLauncher-dev.zip") -Force

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: CapsuleLauncher-dev
          path: artifacts/CapsuleLauncher-dev.zip
          if-no-files-found: error
          retention-days: 14
